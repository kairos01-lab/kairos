name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: "Agg"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python tests (sem binário release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Executar suíte Python
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee python-tests.log

      - name: Resumir resultados Python
        if: always()
        shell: bash
        run: |
          {
            echo "### Python — sem binário release"
            echo '```text'
            grep -E '^(Ran |OK|FAILED)' python-tests.log || true
            echo "PASS=$(grep -cE ' \.\.\. ok' python-tests.log || true)"
            echo "FAIL=$(grep -cE ' \.\.\. FAIL' python-tests.log || true)"
            echo "ERROR=$(grep -cE ' \.\.\. ERROR' python-tests.log || true)"
            echo "SKIP=$(grep -cE ' \.\.\. skipped' python-tests.log || true)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust + integração Python com binário
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências Python
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: projetos/motor_emocional/guarda_costas

      - name: Executar testes Rust
        shell: bash
        working-directory: projetos/motor_emocional/guarda_costas
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee ../../../rust-tests.log

      - name: Compilar Guarda-Costas em release
        working-directory: projetos/motor_emocional/guarda_costas
        run: cargo build --release --locked

      - name: Gerar manifesto SHA-256 do binário
        working-directory: projetos/motor_emocional/guarda_costas
        shell: bash
        run: |
          test -x target/release/guarda_costas
          sha256sum target/release/guarda_costas | awk '{print "release "$1}' > binary_sha256.txt
          test "$(wc -l < binary_sha256.txt)" -eq 1
          test "$(cut -d' ' -f1 binary_sha256.txt)" = "release"

      - name: Executar suíte Python com binário
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee python-integration-tests.log

      - name: Resumir resultados Rust e Python
        if: always()
        shell: bash
        run: |
          {
            echo "### Rust + integração Python"
            echo '```text'
            grep -E 'test result:' rust-tests.log || true
            grep -E '^(Ran |OK|FAILED)' python-integration-tests.log || true
            echo "PASS=$(grep -cE ' \.\.\. ok' python-integration-tests.log || true)"
            echo "FAIL=$(grep -cE ' \.\.\. FAIL' python-integration-tests.log || true)"
            echo "ERROR=$(grep -cE ' \.\.\. ERROR' python-integration-tests.log || true)"
            echo "SKIP=$(grep -cE ' \.\.\. skipped' python-integration-tests.log || true)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
